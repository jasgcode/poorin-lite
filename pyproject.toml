[project]
name = "poorin-lite"
version = "0.1.0"
description = "A research template: artifact tracking and the experiment workflow from Poorin."
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "draccus>=0.11.6",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3.2", "pytest-timeout", "ruff==0.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repro", "src/project"]

[tool.ruff]
line-length = 121
target-version = "py313"

[tool.ruff.lint]
select = [
    "A", "B", "E", "F", "I", "RUF", "UP", "W",
    "N805", "PLR0124", "PLR1722", "RET502", "RET503", "SIM115", "PLC0415",
    "TID252", "ICN001",
]
ignore = ["F722", "B008", "UP015", "UP046", "UP047", "A005", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["repro", "project", "experiments", "tests"]

[tool.ty.environment]
python = ".venv"
python-version = "3.13"

[tool.ty.src]
include = ["repro", "src", "experiments"]

[tool.ty.rules]
# Ported from Poorin, which ignores it too: frozen dataclasses checked against protocols with plain
# attributes, and JSON unions wider than the parameter that receives them.
invalid-argument-type = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
